plugins {
    id "com.android.application"
}

android {
    namespace "com.appfinanciera"
    compileSdk 34

    defaultConfig {
        applicationId "com.appfinanciera"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
